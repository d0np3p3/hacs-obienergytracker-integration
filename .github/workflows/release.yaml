name: Release

# Two ways in:
#
#   git tag v0.0.8 && git push origin v0.0.8   -- the tag drives the release
#   Actions -> Release -> Run workflow          -- manifest.json drives it, and
#                                                  the tag is created alongside
#                                                  the release
#
# Either way the version must be semver and must match manifest.json. The
# previous workflow had no such check, which is how the repository ended up with
# tags (0.0.0.4a, 0.0.1-alpha) matching neither each other nor the manifest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve and check the version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=$(jq -r .version custom_components/obi_energy_tracker/manifest.json)

          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
          else
            # Dispatched from a branch, so the manifest names the version.
            tag="v${manifest}"
          fi

          version="${tag#v}"

          if ! printf '%s' "$version" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag says $version, manifest.json says $manifest"
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease=$prerelease)"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b # master

      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands

  release:
    name: Publish release
    needs: [verify, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail

          # A prerelease suffix is published as one, so HACS keeps offering the
          # last stable version by default.
          flags=""
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          fi

          # --target creates the tag when it does not exist yet, which is what
          # the dispatch path relies on; on a tag push it resolves to the same
          # commit the tag already points at.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            $flags
